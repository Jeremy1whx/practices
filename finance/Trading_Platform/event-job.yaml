apiVersion: batch/v1
kind: Job
metadata:
  name: event-bus-benchmark
spec:
  template:
    spec:
      containers:
      - name: event-bus
        image: event-bus:latest
        imagePullPolicy: Never
        resources:
          requests:
            cpu: "4"
            memory: "2Gi"
          limits:
            cpu: "4"
            memory: "2Gi"
        volumeMounts:
        - name: results
          mountPath: /results
      volumes:
      - name: results
        hostPath:
          path: /mnt/d/k8s-results/event-bus
          type: DirectoryOrCreate
      restartPolicy: Never
  backoffLimit: 0
