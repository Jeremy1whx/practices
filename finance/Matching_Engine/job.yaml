apiVersion: batch/v1
kind: Job
metadata:
  name: matching-benchmark
spec:
  template:
    spec:
      containers:
      - name: matching-engine
        image: matching-engine:latest
        imagePullPolicy: Never
        resources:
          requests:
            cpu: "4"       
            memory: "2Gi"
          limits:
            cpu: "4"      
            memory: "2Gi"
        volumeMounts:
        - name: results
          mountPath: /results
      volumes:
      - name: results
        hostPath:
          path: /mnt/d/k8s-results/matching-benchmark
          type: DirectoryOrCreate
      restartPolicy: Never
  backoffLimit: 0